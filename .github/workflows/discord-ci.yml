name: Discord CI (build, test & release)

# Builds the Discord integration, runs unit tests, and publishes the debug APK
# plus the test report to a rolling GitHub Release on the fork.
on:
  push:
    branches: [ "feature/discord" ]
  workflow_dispatch:

# GITHUB_TOKEN needs write access to create/updated the Release.
permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, test and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Required by app/build.gradle.kts (used with `!!`), otherwise the build fails.
      RVX_DEBUG_APP_NAME: "Stoat Debug"
      # Optional Sentry / analysis flags (kept empty so the build stays self-contained).
      RVX_SENTRY_DSN: ""
      RVX_ANALYSIS_ENABLED: ""
      RVX_ANALYSIS_BASEURL: ""
      RVX_BUILD_FLAVOUR_ID: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (compileSdk 36)
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # The repo has no google-services.json; the Google Services Gradle plugin
      # requires one, so we generate a harmless dummy (package matches applicationId).
      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stoat-ci",
              "storage_bucket": "stoat-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                  "android_client_info": { "package_name": "chat.revolt.debug" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000002",
                  "android_client_info": { "package_name": "chat.revolt" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Tune Gradle memory
        run: echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and run unit tests
        run: set -o pipefail; ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest 2>&1 | tee build.log

      # On failure, publish the tail of the Gradle log as a public commit comment
      # so the error is readable without repo admin rights.
      - name: Surface failure log
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'build.log not found';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) {}
            const tail = log.split('\n').slice(-180).join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: "### CI build failed\n\n```\n" + tail + "\n```"
            });

      - name: Package test report
        if: success()
        run: |
          if [ -d app/build/reports/tests/testDebugUnitTest ]; then
            zip -r test-report.zip app/build/reports/tests/testDebugUnitTest app/build/test-results/testDebugUnitTest
          else
            echo "No test report generated."
          fi

      - name: Publish to GitHub Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: discord-ci
          name: "Discord Integration — CI Build"
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          body: |
            Automated CI build for the Discord integration.

            - Branch: `feature/discord`
            - Commit: ${{ github.sha }}
            - Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Contains the debug APK and the unit-test report.
          artifacts: |
            app/build/outputs/apk/debug/*.apk
            test-report.zip
